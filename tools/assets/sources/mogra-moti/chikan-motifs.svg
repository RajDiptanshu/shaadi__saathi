<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="360" height="160">
  <!--
    Mogra & Moti — chikankari shadow-work motifs (V03). In-house, original drawings.
    Never shown as lines: the pipeline renders these as a soft shadow (blur 4 px, ink at ~9%) that sits on the
    paper beneath the sheer fabric (material-library.md §3).
  -->
  <g fill="#000">
    <!-- phool: a closed mogra bud with a calyx -->
    <g id="phool" transform="translate(60 80)">
      <path d="M0,-52 C22,-34 24,4 0,22 C-24,4 -22,-34 0,-52 Z"/>
      <path d="M-3,22 L-3,52 L3,52 L3,22 Z"/>
      <path d="M0,24 C-10,26 -20,20 -24,12 C-14,14 -6,18 0,24 Z"/>
      <path d="M0,24 C10,26 20,20 24,12 C14,14 6,18 0,24 Z"/>
    </g>
    <!-- murri vine: a curving stem with rice-grain knots -->
    <g id="murri" transform="translate(180 80)">
      <path d="M-60,40 C-30,10 -20,-30 10,-40 C30,-46 48,-34 60,-20" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="-44" cy="20" rx="7" ry="3.6" transform="rotate(-50 -44 20)"/>
      <ellipse cx="-24" cy="-6" rx="7" ry="3.6" transform="rotate(-65 -24 -6)"/>
      <ellipse cx="-4" cy="-30" rx="7" ry="3.6" transform="rotate(-30 -4 -30)"/>
      <ellipse cx="22" cy="-44" rx="7" ry="3.6" transform="rotate(5 22 -44)"/>
      <ellipse cx="46" cy="-34" rx="7" ry="3.6" transform="rotate(35 46 -34)"/>
      <ellipse cx="-12" cy="10" rx="6" ry="3" transform="rotate(20 -12 10)"/>
      <ellipse cx="12" cy="-16" rx="6" ry="3" transform="rotate(40 12 -16)"/>
    </g>
    <!-- jaali: a small lattice of diamonds with dots -->
    <g id="jaali" transform="translate(300 80)" fill="none" stroke="#000" stroke-width="2.4">
      <path d="M0,-44 L22,-22 L0,0 L-22,-22 Z M0,0 L22,22 L0,44 L-22,22 Z M-22,-22 L0,0 L-22,22 L-44,0 Z M22,-22 L44,0 L22,22 L0,0 Z"/>
      <circle cx="0" cy="-22" r="3" fill="#000" stroke="none"/>
      <circle cx="0" cy="22" r="3" fill="#000" stroke="none"/>
      <circle cx="-22" cy="0" r="3" fill="#000" stroke="none"/>
      <circle cx="22" cy="0" r="3" fill="#000" stroke="none"/>
    </g>
  </g>
</svg>
