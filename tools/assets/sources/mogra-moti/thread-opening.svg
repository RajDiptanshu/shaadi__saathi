<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" fill="none">
  <!--
    Mogra & Moti — the opening thread (V01). In-house, original.
    Coordinates are the 390 × 844 design frame (animation-storyboard.md §7).
    Both states use one move + one cubic so they interpolate directly.
    taut: enters the left edge at 74% (y 625), passes the gap between the names, leaves the right edge at 28% (y 236).
    The hero pearl rests on the taut path at t ≈ 0.38 → (150, 496); strand beads sit on t 0.05–0.34.
    Layer order (back to front): shadow, core, highlight. Light is top left, so the highlight sits up-left of the
    core and the contact shadow down-right.
  -->
  <defs>
    <path id="thread-taut" d="M0,625 C140,560 250,330 390,236"/>
    <path id="thread-slack" d="M0,700 C130,650 250,560 390,520"/>
  </defs>
  <g id="thread" stroke-linecap="round">
    <path class="thread-shadow" d="M0,625 C140,560 250,330 390,236" transform="translate(0.9 0.9)" stroke="#2A2520" stroke-opacity="0.18" stroke-width="0.75"/>
    <path class="thread-core" d="M0,625 C140,560 250,330 390,236" stroke="#B89A6A" stroke-width="1.25"/>
    <path class="thread-highlight" d="M0,625 C140,560 250,330 390,236" transform="translate(-0.28 -0.28)" stroke="#E2CFA6" stroke-width="0.5"/>
  </g>
</svg>
