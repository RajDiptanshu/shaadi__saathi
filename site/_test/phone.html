<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#777}iframe{display:block;width:390px;height:844px;border:0}</style></head>
<body><iframe id="f"></iframe>
<script>
// Temporary test harness: /_test/phone.html?src=<page>&y=<scroll>. Delete before deploying.
var q = new URLSearchParams(location.search);
var f = document.getElementById('f');
f.src = q.get('src') || '/demo/haveli-jharokha/';
f.onload = function () {
  setTimeout(function () {
    var w = f.contentWindow;
    w.scrollTo(0, +q.get('y') || 0);
  }, +q.get('wait') || 1500);
};
</script></body></html>
